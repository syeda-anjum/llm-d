# gpt-oss-120b unified serving on two TPU7x 2x2x1 nodes (4 chips, 8 TensorCores per node):
# TP=8 with expert parallelism, MXFP4 checkpoint weights with an fp8 KV cache, and a
# 256 GiB host-DRAM KV tier per pod via SGLang HiCache over TPU Sync (raiden).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  # TPU node pools are fixed-size: a RollingUpdate needs a spare node to surge
  # onto, so the rollout deadlocks with the new pod Pending.
  strategy:
    type: Recreate
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      containers:
        - name: modelserver
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - "--model-path=openai/gpt-oss-120b"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--device=tpu"
            - "--dtype=bfloat16"
            - "--attention-backend=pallas_tpu_rpa_v3"
            - "--sampling-backend=pytorch"
            - "--grammar-backend=none"
            - "--tp-size=8"
            - "--ep-size=8"
            # Matches the router's prefix-cache scorer block size (64 tokens).
            - "--page-size=64"
            - "--kv-cache-dtype=fp8_e4m3"
            - "--mem-fraction-static=0.35"
            - "--max-total-tokens=393216"
            - "--max-running-requests=64"
            - "--chunked-prefill-size=4096"
            - "--max-prefill-tokens=4096"
            # The model's full context (max_position_embeddings).
            - "--context-length=131072"
            - "--enable-torch-compile"
            - "--torch-compile-max-bs=64"
            # The gpt-oss (harmony) parsers, as in upstream SGLang's gpt-oss-120b deployment.
            - "--tool-call-parser=gpt-oss"
            - "--reasoning-parser=gpt-oss"
            - "--skip-server-warmup"
            # Host-DRAM KV tier (L2) through raiden: pages leave HBM into pinned host
            # memory (write_through) and come back on a later prefix hit instead of
            # being recomputed. --hicache-size is GB per TP rank: 32 GB x 8 = 256 GB per
            # pod, inside the 512Gi request.
            - "--enable-hierarchical-cache"
            - "--hicache-io-backend=raiden"
            - "--hicache-mem-layout=page_first_fused"
            - "--hicache-write-policy=write_through"
            - "--hicache-size=32"
            # Reports device and host prefix hits per request (usage.prompt_tokens_details).
            - "--enable-cache-report"
            - "--enable-metrics"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: SGLANG_PLATFORM
              value: tpu
            - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
              value: "0"
            - name: SGLANG_TPU_PRELOAD_TELEMETRY_STUB
              value: "1"
            - name: SGLANG_TPU_OVERLAP_PROFILE
              value: "1"
            # gpt-oss does not support the SparseCore MoE gather path.
            - name: SGLANG_TPU_FUSED_MOE_SC_GATHER
              value: "0"
            - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
              value: "false"
            - name: LIBTPU_INIT_ARGS
              value: >-
                --xla_tpu_enable_async_collective_fusion=true
                --xla_tpu_overlap_compute_collective_tc=true
                --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                --xla_tpu_enable_latency_hiding_scheduler=true
                --xla_latency_hiding_scheduler_rerun=10
                --xla_tpu_all_gather_collective_matmul_mode=post_spmd_conservative
                --xla_tpu_reduce_scatter_collective_matmul_mode=post_spmd_conservative
                --xla_tpu_enable_sparse_core_collective_offload_all_reduce=false
                --xla_tpu_offload_gather_to_sparsecore=false
                --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false
          # ~160 GiB of runtime and weights plus the 256 GB pinned host tier; request =
          # limit so the tier is reserved and the pod is not evicted under node pressure.
          resources:
            requests:
              cpu: "32"
              memory: 512Gi
              google.com/tpu: 4
            limits:
              memory: 512Gi
              google.com/tpu: 4
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            # Checkpoint and torch.compile cache. gke-model-cache-hostpath mounts the
            # node's HuggingFace cache inside it and sets HF_HOME.
            - mountPath: /root/.cache
              name: cache
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 240
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: cache
          emptyDir: {}
