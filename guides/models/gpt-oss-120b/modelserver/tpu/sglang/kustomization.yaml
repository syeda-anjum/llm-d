apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: gpt-oss-120b-tpu-sglang-

components:
  - ../../../../../recipes/modelserver/components/graceful-shutdown
  - ../../../../../recipes/modelserver/components/images/tpu-sglang/release
  - ../../../../../recipes/modelserver/components/gke-model-cache-hostpath

labels:
  - pairs:
      llm-d.ai/guide: gpt-oss-120b
      llm-d.ai/model: gpt-oss-120b
      llm-d.ai/accelerator-variant: tpu
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/backend: torch-tpu
      llm-d.ai/engine-type: sglang
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-sglang.yaml
