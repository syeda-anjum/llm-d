name: kimi-k3

# Which model server runs on which accelerator. `validated` = covered by a
# nightly E2E workflow; `community` = an overlay exists but is not run nightly;
# `unsupported` must link a tracking issue. A missing cell means unsupported.
# Keys must match env.static ACCELERATOR_TYPE / MODEL_SERVER values; `model`
# is the model the accelerator's overlay serves (used for MODEL on llm-d.ai);
# `notes` (optional, one line) fills the Notes column of the support table.
support:
  engines: {vllm: vLLM}
  accelerators:
    tpu:
      label: Google TPU v7x
      notes: >-
        GKE only · Torch TPU vLLM · 1 LeaderWorkerSet replica on a `tpu7x` `2x2x4` slice (4 hosts × 4 chips): TP=8 × DP=4 × EP=32,
        one data-parallel rank per host, each serving its own endpoint (vLLM external DP load balancing) ·
        fp8 KV cache, 262k context, 256 GiB host-DRAM KV tier per rank (`TPURaidenOffloadingConnector`) · weights on a ReadOnlyMany Hyperdisk ML volume hydrated from GCS
      model: moonshotai/Kimi-K3
      engines: {vllm: community}

env:
  static:
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    GUIDE_NAME: kimi-k3
    NAMESPACE: llm-d-kimi-k3

    # Prometheus monitoring is opt-in: set MONITORING=true (requires the
    # monitoring stack) to run the deploy.monitoring* steps.
    MONITORING: {default: "false", values: ["false", "true"]}
    MONITORING_VALUES: {default: ""}

    ACCELERATOR_TYPE: {default: tpu, values: [tpu]}
    MODEL_SERVER: {default: vllm, values: [vllm]}

    MODEL: {default: "moonshotai/Kimi-K3", comment: "the served model name"}
    # GCS bucket holding the moonshotai/ copy that hydrates the model volume.
    MODEL_BUCKET: {default: "my-model-bucket", comment: "GCS bucket that holds the moonshotai/Kimi-K3 copy"}

  source: ["${REPO_ROOT}/guides/env.sh # defines GAIE_VERSION, ROUTER_CHART_VERSION, router chart URLs, and CURL_TEST_IMAGE"]

prerequisites:
  clone:
    - skip_in: [ci]
      run: |
        export BRANCH=main
        git clone https://github.com/llm-d/llm-d.git && cd llm-d && git checkout ${BRANCH}

  gaie:
    - run: |
        # GAIE_URL is automatically calculated from GAIE_VERSION at ${REPO_ROOT}/guides/env.sh
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/${GAIE_URL}/v1-manifests.yaml
  # The model server is a LeaderWorkerSet (one 4-host group per replica).
  # skip_in ci: the nightly clusters already run LWS, and a second release would collide.
  lws:
    - skip_in: [ci]
      run: |
        helm upgrade --install lws oci://registry.k8s.io/lws/charts/lws \
          --version=${LWS_VERSION} \
          --namespace lws-system --create-namespace \
          --wait --timeout 300s
  namespace:
    - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  secrets:
    - skip_in: [ci]
      run: |
        kubectl create secret generic llm-d-hf-token \
          --from-literal="HF_TOKEN=${HF_TOKEN}" \
          --namespace "${NAMESPACE}" \
          --dry-run=client -o yaml | kubectl apply -f -
  model_bucket:
    - skip_in: [ci]
      run: |
        # One-time copy of the 1.56 TB checkpoint into a bucket in the cluster's zone's region.
        hf download moonshotai/Kimi-K3 --local-dir ./Kimi-K3
        gcloud storage cp -r ./Kimi-K3 gs://${MODEL_BUCKET}/moonshotai/
  model_storage_access:
    - skip_in: [ci]
      run: |
        # The GKE Volume Populator's transfer job reads the bucket as this Kubernetes ServiceAccount.
        kubectl create serviceaccount kimi-k3-model-populator -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
        export PROJECT_ID=$(gcloud config get-value project)
        export PROJECT_NUMBER=$(gcloud projects describe ${PROJECT_ID} --format='value(projectNumber)')
        gcloud storage buckets add-iam-policy-binding gs://${MODEL_BUCKET} \
          --member="principal://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${PROJECT_ID}.svc.id.goog/subject/ns/${NAMESPACE}/sa/kimi-k3-model-populator" \
          --role=roles/storage.objectViewer
  model_storage:
    - skip_in: [ci]
      run: |
        # A ReadOnlyMany Hyperdisk ML volume that every model-server pod mounts at /models,
        # hydrated once from gs://${MODEL_BUCKET}/moonshotai by the GKE Volume Populator.
        kubectl apply -n ${NAMESPACE} -f - <<EOF
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: kimi-k3-hyperdisk-ml
        provisioner: pd.csi.storage.gke.io
        parameters:
          type: hyperdisk-ml
          provisioned-throughput-on-create: "6400Mi"
        allowVolumeExpansion: false
        volumeBindingMode: WaitForFirstConsumer
        ---
        apiVersion: datalayer.gke.io/v1
        kind: GCPDataSource
        metadata:
          name: kimi-k3-models
        spec:
          cloudStorage:
            serviceAccountName: kimi-k3-model-populator
            uri: gs://${MODEL_BUCKET}/moonshotai/
        ---
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: kimi-k3-models
        spec:
          accessModes: [ReadOnlyMany]
          storageClassName: kimi-k3-hyperdisk-ml
          resources:
            requests:
              storage: 3400Gi
          dataSourceRef:
            apiGroup: datalayer.gke.io
            kind: GCPDataSource
            name: kimi-k3-models
        EOF

deploy:
  router_values:
    - run: |
        export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
        export ROUTER_VALUES="${REPO_ROOT}/guides/models/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml"

  monitoring_values:
    - when: {MONITORING: ["true"]}
      run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml"

  standalone:
    - run: |
        helm install ${GUIDE_NAME} \
          ${ROUTER_STANDALONE_CHART} \
          -f ${ROUTER_BASE_VALUES} \
          ${MONITORING_VALUES} \
          -f ${ROUTER_VALUES} \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}

  modelserver:
    - run: |
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/

  monitoring:
    - when: {MONITORING: ["true"]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service ${GUIDE_NAME}-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
  tests:
    request:
      - run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"Explain how a simple agent loop works in 3 sentences.\"}"'
    served_model:
      - run: |
          # The router must reach a model server that serves MODEL and returns tokens
          kubectl run serve-check --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'R=$(curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"Say hello.\", \"max_tokens\": 16}")
              echo "${R}" | grep -q "\"model\":\"${MODEL}\"" && echo "${R}" | grep -q "\"choices\"" \
                && echo "OK: ${MODEL} served through the router" \
                || { echo "FAIL: ${R}"; exit 1; }'

cleanup:
  modelserver:
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/
  rest:
    - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring --ignore-not-found=true
    - skip_in: [ci]
      run: |
        # The Hyperdisk ML volume holds a copy of the weights; delete it when you no longer need it.
        kubectl delete pvc kimi-k3-models -n ${NAMESPACE} --ignore-not-found=true
        kubectl delete gcpdatasource kimi-k3-models -n ${NAMESPACE} --ignore-not-found=true
    - skip_in: [ci]
      run: kubectl delete namespace ${NAMESPACE}
